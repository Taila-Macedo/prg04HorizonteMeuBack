spring.application.name=horizontemeu

# ─── Banco de dados Neon (PostgreSQL) ─────────────────────────────────────────
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://aws-1-sa-east-1.pooler.supabase.com:5432/postgres?sslmode=require}
spring.datasource.username=${DATABASE_USERNAME:postgres.kfrrvnkqftsbmppkwpcr}
spring.datasource.password=${DATABASE_PASSWORD:prg04HorizonteMeuBack}
spring.datasource.driver-class-name=org.postgresql.Driver

# ─── JPA / Hibernate ──────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ─── Upload de arquivos (fotos) ───────────────────────────────────────────────
# Sem isso, o Spring usa o padrão de 1MB por arquivo — pequeno demais pra fotos
# de celular, o que causava MaxUploadSizeExceededException (500) no upload.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ─── Pool de conexões do banco ────────────────────────────────────────────────
# Reduzido de 10 (padrão) pra 5 — projeto pequeno, poucos usuários simultâneos.
# Cada conexão do pool consome memória; isso ajuda a caber dentro dos 512MB
# do plano gratuito/trial do Railway.
spring.datasource.hikari.maximum-pool-size=5

# ─── JWT ──────────────────────────────────────────────────────────────────────
jwt.secret=${JWT_SECRET:horizonte-meu-chave-secreta-super-segura-2025}
jwt.expiration-ms=86400000

